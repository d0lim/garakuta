name: Bug report
description: Something does not work as described
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, what happened instead.
    validations:
      required: true
  - type: dropdown
    id: module
    attributes:
      label: Module
      options: [Menu bar, Notch panel, Window switcher, Onboarding / settings, Build / packaging, Other]
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS version
      placeholder: "26.6.2 (25G83)"
    validations:
      required: true
  - type: checkboxes
    id: permissions
    attributes:
      label: Permissions granted to Garakuta
      options:
        - label: Accessibility
        - label: Screen Recording
  - type: input
    id: displays
    attributes:
      label: Displays
      placeholder: "Built-in (notch) + one external"
  - type: checkboxes
    id: others
    attributes:
      label: Other utilities running at the time
      options:
        - label: Another menu bar manager
        - label: Another window switcher
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: "`log show --last 5m --predicate 'process == \"Garakuta\"' --style compact`"
      render: text
