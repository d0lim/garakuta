name: CI

on:
  push:
    branches: [main]
  pull_request:

defaults:
  run:
    # Fail a step when any command in a pipeline fails, so `| tail` cannot hide a broken build.
    shell: bash -eo pipefail {0}

jobs:
  build:
    name: Build and test (macOS)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.4.app || sudo xcode-select -s "$(ls -d /Applications/Xcode_16*.app | sort -V | tail -1)"
      - name: Swift version
        run: swift --version
      - name: Build (debug)
        run: swift build -v 2>&1 | tail -20
      - name: Test
        run: swift test 2>&1 | tail -30
      - name: Build (release) and bundle
        run: ./scripts/bundle.sh release
      - name: Upload app bundle
        uses: actions/upload-artifact@v4
        with:
          name: Garakuta.app
          path: build/Garakuta.app
          if-no-files-found: error
